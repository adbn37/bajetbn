name: Deploy BajetBN Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bajetbn-staging-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Validate and deploy staging
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: https://bajetbn-staging.pages.dev

    env:
      VITE_APP_ENV: staging
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_FUNCTIONS_REGION: ${{ secrets.VITE_FIREBASE_FUNCTIONS_REGION }}

    steps:
      - name: Check out staging source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build Firebase Functions
        run: npm run build --prefix functions

      - name: Run feature regression checks
        run: |
          node scripts/verify-release-candidate-hardening.mjs
          node scripts/verify-language-theme-settings.mjs
          node scripts/verify-calendar-search-reminders.mjs
          node scripts/verify-reports-money-insights.mjs
          node scripts/verify-simple-language.mjs
          node scripts/verify-collaboration-whatsapp.mjs
          node scripts/verify-shared-bill-payment-finalisation.mjs
          node scripts/verify-budgets-goals-commitments.mjs
          node scripts/verify-transaction-ledger.mjs
          node scripts/verify-commitment-amount-labels.mjs
          node scripts/verify-categories-transaction-ux.mjs
          node scripts/verify-structure.mjs

      - name: Build staging
        run: npm run build -- --mode staging

      - name: Verify build and PWA output
        run: node scripts/verify-build-output.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd "$RUNNER_TEMP"
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/dist" \
            --project-name bajetbn-staging \
            --branch staging

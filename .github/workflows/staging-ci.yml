name: Deploy BajetBN Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bajetbn-staging-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Validate and deploy staging
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: https://bajetbn-staging.pages.dev

    env:
      VITE_APP_ENV: staging
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_FUNCTIONS_REGION: ${{ secrets.VITE_FIREBASE_FUNCTIONS_REGION }}

    steps:
      - name: Check out staging source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Functions changes
        id: functions_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: validating Firebase Functions."
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No reliable previous SHA: validating Firebase Functions."
            exit 0
          fi

          if git diff --quiet "$before" "$after" -- functions .node-version; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Firebase Functions source unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Firebase Functions source changed."
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Functions dependencies
        if: steps.functions_changes.outputs.changed == 'true'
        run: npm ci --prefix functions

      - name: TypeScript validation
        run: npm run typecheck

      - name: Build Firebase Functions
        if: steps.functions_changes.outputs.changed == 'true'
        run: npm run build --prefix functions

      - name: Run all structural and release-safety checks
        run: npm run verify:all-structural

      - name: Run v1.14.18 performance maintenance checks
        run: npm run verify:v11418-performance

      - name: Build staging
        run: npm run build:staging:ci

      - name: Verify build and PWA output
        run: |
          node scripts/verify-build-output.mjs
          npm run verify:built-environment-v11417 -- staging

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd "$RUNNER_TEMP"
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/dist" \
            --project-name bajetbn-staging \
            --branch staging
